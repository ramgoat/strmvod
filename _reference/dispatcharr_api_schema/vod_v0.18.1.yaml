  /api/vod/vodlogos/:
    get:
      operationId: api_vod_vodlogos_list
      description: ViewSet for VOD Logo management
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - api
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedVODLogoList'
          description: ''
    post:
      operationId: api_vod_vodlogos_create
      description: ViewSet for VOD Logo management
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VODLogo'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VODLogo'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VODLogo'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VODLogo'
          description: ''
  /api/vod/vodlogos/{id}/:
    get:
      operationId: api_vod_vodlogos_retrieve
      description: ViewSet for VOD Logo management
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this VOD Logo.
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VODLogo'
          description: ''
    put:
      operationId: api_vod_vodlogos_update
      description: ViewSet for VOD Logo management
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this VOD Logo.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VODLogo'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VODLogo'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VODLogo'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VODLogo'
          description: ''
    patch:
      operationId: api_vod_vodlogos_partial_update
      description: ViewSet for VOD Logo management
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this VOD Logo.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedVODLogo'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedVODLogo'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedVODLogo'
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VODLogo'
          description: ''
    delete:
      operationId: api_vod_vodlogos_destroy
      description: ViewSet for VOD Logo management
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this VOD Logo.
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '204':
          description: No response body
  /api/vod/vodlogos/{id}/cache/:
    get:
      operationId: api_vod_vodlogos_cache_retrieve
      description: Streams the VOD logo file, whether it's local or remote.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this VOD Logo.
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - BearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VODLogo'
          description: ''
  /api/vod/vodlogos/bulk-delete/:
    delete:
      operationId: api_vod_vodlogos_bulk_delete_destroy
      description: Delete multiple VOD logos at once
      tags:
      - api
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '204':
          description: No response body
  /api/vod/vodlogos/cleanup/:
    post:
      operationId: api_vod_vodlogos_cleanup_create
      description: Delete all VOD logos that are not used by any movies or series
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VODLogo'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VODLogo'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VODLogo'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VODLogo'
          description: ''
components:
  schemas:
    CategoryTypeEnum:
      enum:
      - movie
      - series
      type: string
      description: '* `movie` - Movie

        * `series` - Series'
    Episode:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        series:
          allOf:
          - $ref: '#/components/schemas/Series'
          readOnly: true
        uuid:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        air_date:
          type: string
          format: date
          nullable: true
        rating:
          type: string
          nullable: true
          maxLength: 10
        duration_secs:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
          description: Duration in seconds
        season_number:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        episode_number:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        tmdb_id:
          type: string
          nullable: true
          description: TMDB ID for metadata
          maxLength: 50
        imdb_id:
          type: string
          nullable: true
          description: IMDB ID for metadata
          maxLength: 50
        custom_properties:
          nullable: true
          description: Custom properties for this episode
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - series
      - updated_at
      - uuid
    M3UVODCategoryRelation:
      type: object
      properties:
        category:
          type: integer
        m3u_account:
          type: integer
        enabled:
          type: boolean
          description: Set to false to deactivate this category for the M3U account
      required:
      - category
      - m3u_account
    Movie:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        logo:
          allOf:
          - $ref: '#/components/schemas/VODLogo'
          readOnly: true
        uuid:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        year:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        rating:
          type: string
          nullable: true
          maxLength: 10
        genre:
          type: string
          nullable: true
          maxLength: 255
        duration_secs:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
          description: Duration in seconds
        tmdb_id:
          type: string
          nullable: true
          description: TMDB ID for metadata
          maxLength: 50
        imdb_id:
          type: string
          nullable: true
          description: IMDB ID for metadata
          maxLength: 50
        custom_properties:
          nullable: true
          description: Additional metadata and properties for the movie
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - logo
      - name
      - updated_at
      - uuid
    PaginatedEpisodeList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Episode'
    PaginatedMovieList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Movie'
    PaginatedSeriesList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Series'
    PaginatedVODLogoList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/VODLogo'
    PatchedVODLogo:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        url:
          type: string
        cache_url:
          type: string
          readOnly: true
        movie_count:
          type: string
          readOnly: true
        series_count:
          type: string
          readOnly: true
        is_used:
          type: string
          readOnly: true
        item_names:
          type: string
          readOnly: true
    Series:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        logo:
          allOf:
          - $ref: '#/components/schemas/VODLogo'
          readOnly: true
        episode_count:
          type: string
          readOnly: true
        uuid:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        year:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        rating:
          type: string
          nullable: true
          maxLength: 10
        genre:
          type: string
          nullable: true
          maxLength: 255
        tmdb_id:

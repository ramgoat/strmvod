openapi: 3.0.3
info:
  title: Dispatcharr API - Channels
  version: 1.0.0
  description: API documentation for Dispatcharr - Channels endpoints
paths:
  /api/channels/channels/:
    get:
      operationId: api_channels_channels_list
      parameters:
      - in: query
        name: channel_group
        schema:
          type: string
      - in: query
        name: epg
        schema:
          type: string
      - in: query
        name: name
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - api
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedChannelList'
          description: ''
    post:
      operationId: api_channels_channels_create
      description: Override create to handle channel profile membership
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Channel'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Channel'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Channel'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
          description: ''
  /api/channels/channels/{channel_id}/streams/:
    get:
      operationId: api_channels_channels_streams_retrieve
      parameters:
      - in: path
        name: channel_id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          description: No response body
  /api/channels/channels/{id}/:
    get:
      operationId: api_channels_channels_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this channel.
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
          description: ''
    put:
      operationId: api_channels_channels_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this channel.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Channel'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Channel'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Channel'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
          description: ''
    patch:
      operationId: api_channels_channels_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this channel.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedChannel'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedChannel'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedChannel'
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
          description: ''
    delete:
      operationId: api_channels_channels_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this channel.
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '204':
          description: No response body
  /api/channels/channels/{id}/match-epg/:
    post:
      operationId: api_channels_channels_match_epg_create_2
      description: Try to auto-match this specific channel with EPG data.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this channel.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Channel'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Channel'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Channel'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
          description: ''
  /api/channels/channels/{id}/reorder/:
    post:
      operationId: api_channels_channels_reorder_create
      description: Reorder a channel by moving it after another channel (or to the start if insert_after_id is null). The
        channel will receive the next whole number after the target channel, and all subsequent channels will be renumbered
        accordingly.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this channel.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderChannelRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReorderChannelRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReorderChannelRequest'
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
          description: ''
  /api/channels/channels/{id}/set-epg/:
    post:
      operationId: api_channels_channels_set_epg_create
      description: Set EPG data for a channel and refresh program data
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this channel.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetEpgRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SetEpgRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SetEpgRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
                description: Unspecified response body
          description: ''
  /api/channels/channels/assign/:
    post:
      operationId: api_channels_channels_assign_create
      description: Auto-assign channel_number in bulk by an ordered list of channel IDs.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignChannelsRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssignChannelsRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssignChannelsRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
          description: ''
  /api/channels/channels/batch-set-epg/:
    post:
      operationId: api_channels_channels_batch_set_epg_create
      description: Associate multiple channels with EPG data without triggering a full refresh
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchSetEpgRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BatchSetEpgRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BatchSetEpgRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
          description: ''
  /api/channels/channels/bulk-delete/:
    delete:
      operationId: api_channels_channels_bulk_delete_destroy
      description: Bulk delete channels by ID
      tags:
      - api
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '204':
          description: No response body
  /api/channels/channels/edit/bulk/:
    patch:
      operationId: api_channels_channels_edit_bulk_partial_update
      description: 'Bulk edit channels efficiently.

        Validates all updates first, then applies in a single transaction.'
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedChannel'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedChannel'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedChannel'
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
          description: ''
  /api/channels/channels/from-stream/:
    post:
      operationId: api_channels_channels_from_stream_create
      description: Create a new channel from an existing stream. If 'channel_number' is provided, it will be used (if available);
        otherwise, the next available channel number is assigned. If 'channel_profile_ids' is provided, the channel will only
        be added to those profiles. Accepts either a single ID or an array of IDs.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FromStreamRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FromStreamRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FromStreamRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
          description: ''
  /api/channels/channels/from-stream/bulk/:
    post:
      operationId: api_channels_channels_from_stream_bulk_create
      description: Asynchronously bulk create channels from stream IDs. Returns a task ID to track progress via WebSocket.
        This is the recommended approach for large bulk operations.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FromStreamBulkRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FromStreamBulkRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FromStreamBulkRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
          description: ''
  /api/channels/channels/ids/:
    get:
      operationId: api_channels_channels_ids_retrieve
      tags:
      - api
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
          description: ''
  /api/channels/channels/match-epg/:
    post:
      operationId: api_channels_channels_match_epg_create
      description: Kick off a Celery task that tries to fuzzy-match channels with EPG data. If channel_ids are provided, only
        those channels will be processed.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchEpgRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MatchEpgRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MatchEpgRequest'
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
          description: ''
  /api/channels/channels/set-logos-from-epg/:
    post:
      operationId: api_channels_channels_set_logos_from_epg_create
      description: Trigger a Celery task to set channel logos from EPG data
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Channel'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Channel'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Channel'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
          description: ''
  /api/channels/channels/set-names-from-epg/:
    post:
      operationId: api_channels_channels_set_names_from_epg_create
      description: Trigger a Celery task to set channel names from EPG data
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Channel'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Channel'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Channel'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
          description: ''
  /api/channels/channels/set-tvg-ids-from-epg/:
    post:
      operationId: api_channels_channels_set_tvg_ids_from_epg_create
      description: Trigger a Celery task to set channel TVG-IDs from EPG data
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Channel'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Channel'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Channel'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
          description: ''
  /api/channels/dvr/comskip-config/:
    get:
      operationId: api_channels_dvr_comskip_config_retrieve
      description: Upload or inspect the custom comskip.ini used by DVR processing.
      tags:
      - api
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: api_channels_dvr_comskip_config_create
      description: Upload or inspect the custom comskip.ini used by DVR processing.
      tags:
      - api
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          description: No response body
  /api/channels/groups/:
    get:
      operationId: api_channels_groups_list
      tags:
      - api
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChannelGroup'
          description: ''
    post:
      operationId: api_channels_groups_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelGroup'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChannelGroup'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChannelGroup'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelGroup'
          description: ''
  /api/channels/groups/{id}/:
    get:
      operationId: api_channels_groups_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this channel group.
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelGroup'
          description: ''
    put:
      operationId: api_channels_groups_update
      description: Override update to check M3U associations
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this channel group.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelGroup'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChannelGroup'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChannelGroup'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelGroup'
          description: ''
    patch:
      operationId: api_channels_groups_partial_update
      description: Override partial_update to check M3U associations
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this channel group.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedChannelGroup'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedChannelGroup'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedChannelGroup'
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelGroup'
          description: ''
    delete:
      operationId: api_channels_groups_destroy
      description: Override destroy to check for associations before deletion
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this channel group.
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '204':
          description: No response body
  /api/channels/groups/cleanup/:
    post:
      operationId: api_channels_groups_cleanup_create
      description: Delete all channel groups that have no associations (no channels or M3U accounts)
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelGroup'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChannelGroup'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChannelGroup'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelGroup'
          description: ''
  /api/channels/logos/:
    get:
      operationId: api_channels_logos_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - api
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLogoList'
          description: ''
    post:
      operationId: api_channels_logos_create
      description: Create a new logo entry
      tags:
      - api
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Logo'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Logo'
          application/json:
            schema:
              $ref: '#/components/schemas/Logo'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Logo'
          description: ''
  /api/channels/logos/{id}/:
    get:
      operationId: api_channels_logos_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this logo.
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Logo'
          description: ''
    put:
      operationId: api_channels_logos_update
      description: Update an existing logo
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this logo.
        required: true
      tags:
      - api
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Logo'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Logo'
          application/json:
            schema:
              $ref: '#/components/schemas/Logo'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Logo'
          description: ''
    patch:
      operationId: api_channels_logos_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this logo.
        required: true
      tags:
      - api
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedLogo'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedLogo'
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedLogo'
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Logo'
          description: ''
    delete:
      operationId: api_channels_logos_destroy
      description: Delete a logo and remove it from any channels using it
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this logo.
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '204':
          description: No response body
  /api/channels/logos/{id}/cache/:
    get:
      operationId: api_channels_logos_cache_retrieve
      description: Streams the logo file, whether it's local or remote.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this logo.
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - BearerAuth: []
      - {}
      responses:
        '200':
          content:

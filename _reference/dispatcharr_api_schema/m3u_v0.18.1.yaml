components:
  schemas:
    AccountTypeEnum:
      enum:
      - STD
      - XC
      type: string
      description: '* `STD` - Standard

        * `XC` - Xtream Codes'
    ChannelGroupM3UAccount:
      type: object
      properties:
        m3u_accounts:
          type: integer
          readOnly: true
        channel_group:
          type: integer
        enabled:
          type: boolean
        auto_channel_sync:
          type: boolean
          default: false
        auto_sync_channel_start:
          type: number
          format: double
          nullable: true
        custom_properties: {}
        is_stale:
          type: boolean
          description: Whether this group relationship is stale (not seen in recent refresh, pending deletion)
        last_seen:
          type: string
          format: date-time
          description: Last time this group was seen in the M3U source during a refresh
      required:
      - channel_group
      - enabled
      - m3u_accounts
    FilterTypeEnum:
      enum:
      - group
      - name
      - url
      type: string
      description: '* `group` - Group

        * `name` - Stream Name

        * `url` - Stream URL'
    M3UAccount:
      type: object
      description: Serializer for M3U Account
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          description: Unique name for this M3U account
          maxLength: 255
        server_url:
          type: string
          nullable: true
        file_path:
          type: string
          nullable: true
          maxLength: 255
        server_group:
          type: integer
          nullable: true
          description: The server group this M3U account belongs to
        max_streams:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Maximum number of concurrent streams (0 for unlimited)
        is_active:
          type: boolean
          description: Set to false to deactivate this M3U account
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: Time when this account was created
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: Time when this account was last successfully refreshed
        filters:
          type: string
          readOnly: true
        user_agent:
          type: integer
          nullable: true
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/M3UAccountProfile'
          readOnly: true
        locked:
          type: boolean
          description: Protected - can't be deleted or modified
        channel_groups:
          type: array
          items:
            $ref: '#/components/schemas/ChannelGroupM3UAccount'
        refresh_interval:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        custom_properties:
          nullable: true
        account_type:
          $ref: '#/components/schemas/AccountTypeEnum'
        username:
          type: string
          nullable: true
          maxLength: 255
        password:
          type: string
          nullable: true
          maxLength: 255
        stale_stream_days:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Number of days after which a stream will be removed if not seen in the M3U source.
        priority:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Priority for VOD provider selection (higher numbers = higher priority). Used when multiple providers
            offer the same content.
        status:
          $ref: '#/components/schemas/M3UAccountStatusEnum'
        last_message:
          type: string
          nullable: true
          description: Last status message, including success results or error information
        enable_vod:
          type: boolean
          writeOnly: true
        auto_enable_new_groups_live:
          type: boolean
          writeOnly: true
        auto_enable_new_groups_vod:
          type: boolean
          writeOnly: true
        auto_enable_new_groups_series:
          type: boolean
          writeOnly: true
      required:
      - created_at
      - filters
      - id
      - name
      - profiles
    M3UAccountProfile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          description: Name for the M3U account profile
          maxLength: 255
        max_streams:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Maximum number of concurrent streams (0 for unlimited)
        is_active:
          type: boolean
          description: Set to false to deactivate this profile
        is_default:
          type: boolean
          description: Set to false to deactivate this profile
        current_viewers:
          type: integer
          maximum: 2147483647
          minimum: 0
        search_pattern:
          type: string
          maxLength: 255
        replace_pattern:
          type: string
          maxLength: 255
        custom_properties:
          nullable: true
          description: Custom properties for storing account information from provider (e.g., XC account details, expiration
            dates)
        account:
          type: string
          readOnly: true
      required:
      - account
      - id
      - name
    M3UAccountStatusEnum:
      enum:

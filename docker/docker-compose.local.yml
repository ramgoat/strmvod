services:
  dispatcharr:
    # build:
    #   context: ..
    #   dockerfile: docker/Dockerfile.dev
    image: ghcr.io/dispatcharr/dispatcharr:${IMAGE_TAG}
    container_name: dispatcharr
    ports:
      - 5656:5656 # API port
      - 9193:9191 # Web UI port
      - 8001:8001 # Socket port
      - 5678:5678 # Debugging port
    volumes:
      - ../plugin:/data/plugins/strmvod
      - ${DATA_DIR}/:/data
      - ./.vod:/vod
    environment:
      # - DISPATCHARR_ENV=dev
      - DISPATCHARR_DEBUG=true
      - REDIS_HOST=localhost
      - CELERY_BROKER_URL=redis://localhost:6379/0
      - DISPATCHARR_LOG_LEVEL=trace
      - TZ=America/Toronto
      # Legacy CPU Support (Optional)
      # Uncomment to enable legacy NumPy build for older CPUs (circa 2009)
      # that lack support for newer baseline CPU features
      #- USE_LEGACY_NUMPY=true
      # Process Priority Configuration (Optional)
      # Lower values = higher priority. Range: -20 (highest) to 19 (lowest)
      # Negative values require cap_add: SYS_NICE (uncomment below)
      #- UWSGI_NICE_LEVEL=-5   # uWSGI/FFmpeg/Streaming (default: 0, recommended: -5 for high priority)
      #- CELERY_NICE_LEVEL=5   # Celery/EPG/Background tasks (default: 5, low priority)
    #
    # Uncomment to enable high priority for streaming (required if UWSGI_NICE_LEVEL < 0)
    #cap_add:
    #  - SYS_NICE
    restart: unless-stopped

  emby:
    image: emby/embyserver:4.8.10.0
    container_name: emby
    ports:
      - 8096:8096   # HTTP
      - 8920:8920   # HTTPS
    volumes:
      - ./.emby-config:/config
      - ./.vod:/mnt/vod
      - ./.media:/mnt/media
    environment:
      - UID=1000
      - GID=1000
    restart: unless-stopped

  seerr:
    image: ghcr.io/seerr-team/seerr:${SEERR_IMAGE_TAG}
    init: true
    container_name: seerr
    environment:
      - LOG_LEVEL=debug
      - TZ=America/Toronto
    ports:
      - 5055:5055
    volumes:
      - ./.seerr-config:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped
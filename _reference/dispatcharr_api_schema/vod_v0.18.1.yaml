openapi: 3.0.3
info:
  title: Dispatcharr API - VOD
  version: 1.0.0
  description: API documentation for Dispatcharr - VOD endpoints
paths:
  /api/vod/all/:
    get:
      operationId: api_vod_all_list
      description: Override list to handle unified content properly - database-level approach
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - api
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMovieList'
          description: ''
  /api/vod/all/{id}/:
    get:
      operationId: api_vod_all_retrieve
      description: ViewSet that combines Movies and Series for unified 'All' view
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Movie.
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movie'
          description: ''
  /api/vod/categories/:
    get:
      operationId: api_vod_categories_list
      description: Override list to ensure Uncategorized categories and relations exist for all XC accounts with VOD enabled
      parameters:
      - in: query
        name: category_type
        schema:
          type: string
          enum:
          - movie
          - series
        description: 'Type of content this category contains


          * `movie` - Movie

          * `series` - Series'
      - in: query
        name: m3u_account
        schema:
          type: number
      - in: query
        name: name
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - api
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VODCategory'
          description: ''
  /api/vod/categories/{id}/:
    get:
      operationId: api_vod_categories_retrieve
      description: ViewSet for VOD Categories
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this VOD Category.
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VODCategory'
          description: ''
  /api/vod/episodes/:
    get:
      operationId: api_vod_episodes_list
      description: ViewSet for Episode content
      parameters:
      - in: query
        name: episode_number
        schema:
          type: integer
      - in: query
        name: m3u_account
        schema:
          type: number
      - in: query
        name: name
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: season_number
        schema:
          type: integer
      - in: query
        name: series
        schema:
          type: integer
      tags:
      - api
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEpisodeList'
          description: ''
  /api/vod/episodes/{id}/:
    get:
      operationId: api_vod_episodes_retrieve

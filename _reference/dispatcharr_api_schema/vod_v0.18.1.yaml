  /api/vod/movies/:
    get:
      operationId: api_vod_movies_list
      description: ViewSet for Movie content
      parameters:
      - in: query
        name: category
        schema:
          type: string
      - in: query
        name: m3u_account
        schema:
          type: integer
      - in: query
        name: name
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: year
        schema:
          type: integer
      - in: query
        name: year_gte
        schema:
          type: integer
      - in: query
        name: year_lte
        schema:
          type: integer
      tags:
      - api
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMovieList'
          description: ''
  /api/vod/movies/{id}/:
    get:
      operationId: api_vod_movies_retrieve
      description: ViewSet for Movie content
      parameters:
      - in: path

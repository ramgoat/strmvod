openapi: 3.0.3
info:
  title: Dispatcharr API - M3U
  version: 1.0.0
  description: API documentation for Dispatcharr - M3U endpoints
paths:
  /api/m3u/accounts/:
    get:
      operationId: api_m3u_accounts_list
      description: Handles CRUD operations for M3U accounts
      tags:
      - api
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:

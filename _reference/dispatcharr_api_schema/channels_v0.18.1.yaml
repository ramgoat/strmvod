components:
  schemas:
    AssignChannelsRequest:
      type: object
      properties:
        starting_number:
          type: number
          format: double
          description: Starting channel number to assign (can be decimal)
        channel_ids:
          type: array
          items:
            type: integer
          description: Channel IDs to assign
      required:
      - channel_ids
    BatchSetEpgRequest:
      type: object
      properties:
        associations:
          type: array
          items:
            $ref: '#/components/schemas/EpgAssociation'
      required:
      - associations
    BulkRemoveSeriesRecordingsRequest:
      type: object
      properties:
        tvg_id:
          type: string
          description: Channel TVG ID (required)
        title:
          type: string
          description: Series title - when scope=title, only recordings matching this title are removed
        scope:
          allOf:
          - $ref: '#/components/schemas/ScopeEnum'
          default: title
          description: 'title: remove only matching title on channel, channel: remove all future recordings on channel


            * `title` - title

            * `channel` - channel'
      required:
      - tvg_id
    ChanneProfilelMembershipUpdate:
      type: object
      properties:
        channel_id:
          type: integer
        enabled:
          type: boolean
      required:
      - channel_id
      - enabled
    Channel:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        channel_number:
          type: number
          format: double
          nullable: true
        name:
          type: string
          maxLength: 255
        channel_group_id:
          type: integer
        tvg_id:
          type: string
          nullable: true
          maxLength: 255
        tvc_guide_stationid:
          type: string
          nullable: true
          maxLength: 255
        epg_data_id:
          type: integer
          nullable: true
        streams:
          type: array
          items:
            type: integer
        stream_profile_id:
          type: integer
          nullable: true
        uuid:
          type: string
          format: uuid
          readOnly: true
        logo_id:
          type: integer
          nullable: true
        user_level:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        is_adult:
          type: boolean
          description: Whether this channel contains adult content
        auto_created:
          type: boolean
          description: Whether this channel was automatically created via M3U auto channel sync
        auto_created_by:
          type: integer
          nullable: true
          description: The M3U account that auto-created this channel
        auto_created_by_name:
          type: string
          readOnly: true
      required:
      - auto_created_by_name
      - id
      - name
      - uuid
    ChannelGroup:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
        channel_count:
          type: string
          readOnly: true
        m3u_account_count:
          type: string
          readOnly: true
        m3u_accounts:
          type: array
          items:
            $ref: '#/components/schemas/ChannelGroupM3UAccount'
          readOnly: true
      required:
      - channel_count
      - id
      - m3u_account_count
      - m3u_accounts
      - name
    ChannelGroupM3UAccount:
      type: object
      properties:
        m3u_accounts:
          type: integer
          readOnly: true
        channel_group:
          type: integer
        enabled:
          type: boolean
        auto_channel_sync:
          type: boolean
          default: false
        auto_sync_channel_start:
          type: number
          format: double
          nullable: true
        custom_properties: {}
        is_stale:
          type: boolean
          description: Whether this group relationship is stale (not seen in recent refresh, pending deletion)
        last_seen:
          type: string
          format: date-time
          description: Last time this group was seen in the M3U source during a refresh
      required:
      - channel_group
      - enabled
      - m3u_accounts
    ChannelProfile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        channels:
          type: string
          readOnly: true
      required:
      - channels
      - id
      - name
    CleanupUnusedLogosRequest:
      type: object
      properties:
        delete_files:
          type: boolean
          default: false
          description: Whether to delete local logo files from disk
    EpgAssociation:
      type: object
      properties:
        channel_id:
          type: integer
        epg_data_id:
          type: integer
      required:
      - channel_id
      - epg_data_id
    EvaluateSeriesRulesRequest:
      type: object
      properties:
        tvg_id:
          type: string
          description: 'Optional: evaluate only rules for this channel TVG ID. If omitted, all rules are evaluated.'
    FromStreamBulkRequest:
      type: object
      properties:
        stream_ids:
          type: array
          items:
            type: integer
          description: List of stream IDs to create channels from
        channel_profile_ids:
          type: array
          items:
            type: integer
          description: '(Optional) Channel profile ID(s). Behavior: omitted = add to ALL profiles (default); empty array []
            = add to NO profiles; [0] = add to ALL profiles (explicit); [1,2,...] = add only to specified profiles.'
        starting_channel_number:
          type: integer
          description: '(Optional) Starting channel number mode: null=use provider numbers, 0=lowest available, other=start
            from specified number'
      required:
      - stream_ids
    FromStreamRequest:
      type: object
      properties:
        stream_id:
          type: integer
          description: ID of the stream to link
        channel_number:
          type: number
          format: double
          description: (Optional) Desired channel number. Must not be in use.
        name:
          type: string
          description: Desired channel name
        channel_profile_ids:
          type: array
          items:
            type: integer
          description: '(Optional) Channel profile ID(s). Behavior: omitted = add to ALL profiles (default); empty array []
            = add to NO profiles; [0] = add to ALL profiles (explicit); [1,2,...] = add only to specified profiles.'
      required:
      - stream_id
    Logo:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        url:
          type: string
        cache_url:
          type: string
          readOnly: true
        channel_count:
          type: string
          readOnly: true
        is_used:
          type: string
          readOnly: true
        channel_names:
          type: string
          readOnly: true
      required:
      - cache_url
      - channel_count
      - channel_names
      - id
      - is_used
      - name
      - url
    MatchEpgRequest:

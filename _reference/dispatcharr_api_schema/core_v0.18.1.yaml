components:
  schemas:
    CoreSettings:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        key:
          type: string
          maxLength: 255
        name:
          type: string
          maxLength: 255
        value: {}
      required:
      - id
      - key
      - name
    NotificationTypeEnum:
      enum:
      - version_update
      - setting_recommendation
      - announcement
      - warning
      - info
      type: string
      description: '* `version_update` - Version Update Available

        * `setting_recommendation` - Recommended Setting Change

        * `announcement` - System Announcement

        * `warning` - Warning

        * `info` - Information'
    PatchedCoreSettings:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        key:
          type: string
          maxLength: 255
        name:
          type: string
          maxLength: 255
        value: {}
    PatchedStreamProfile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          description: Name of the stream profile
          maxLength: 255
        command:
          type: string
          description: Command to execute (e.g., 'yt.sh', 'streamlink', or 'vlc')
          maxLength: 255
        parameters:
          type: string
          description: Command-line parameters. Use {userAgent} and {streamUrl} as placeholders.
        is_active:
          type: boolean
          description: Whether this profile is active
        user_agent:
          type: integer
          nullable: true
          description: Optional user agent to use. If not set, you can fall back to a default.
        locked:
          type: boolean
          description: Protected - can't be deleted or modified
    PatchedSystemNotification:
      type: object
      description: Serializer for system notifications.
      properties:
        id:
          type: integer
          readOnly: true
        notification_key:
          type: string
          maxLength: 255
        notification_type:
          $ref: '#/components/schemas/NotificationTypeEnum'
        priority:
          $ref: '#/components/schemas/PriorityEnum'
        title:
          type: string
          maxLength: 255
        message:
          type: string
        action_data: {}
        is_active:
          type: boolean
        admin_only:
          type: boolean
        expires_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        is_dismissed:
          type: string
          readOnly: true
        source:
          $ref: '#/components/schemas/SourceEnum'
    PatchedUserAgent:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          description: The User-Agent name.
          maxLength: 512
        user_agent:
          type: string
          description: The complete User-Agent string sent by the client.
          maxLength: 512
        description:
          type: string
          description: An optional description of the client or device type.
          maxLength: 255
        is_active:
          type: boolean
          description: Whether this user agent is currently allowed/recognized.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PriorityEnum:
      enum:
      - low
      - normal
      - high
      - critical
      type: string
      description: '* `low` - Low

        * `normal` - Normal

        * `high` - High

        * `critical` - Critical'
    SourceEnum:
      enum:
      - system
      - developer
      type: string
      description: '* `system` - System Generated

        * `developer` - Developer Notification'
    StreamProfile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          description: Name of the stream profile
          maxLength: 255
        command:
          type: string
          description: Command to execute (e.g., 'yt.sh', 'streamlink', or 'vlc')
          maxLength: 255
        parameters:
          type: string
          description: Command-line parameters. Use {userAgent} and {streamUrl} as placeholders.
        is_active:
          type: boolean
          description: Whether this profile is active
        user_agent:
          type: integer
          nullable: true
          description: Optional user agent to use. If not set, you can fall back to a default.
        locked:
          type: boolean
          description: Protected - can't be deleted or modified
      required:
      - id
      - name
    SystemNotification:

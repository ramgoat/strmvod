name: Create release on tag

on:
  push:
    tags:
      - '*'   # run on any tag

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # required for creating releases & uploading assets

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Get tag name
        id: get_tag
        run: echo "TAG_NAME=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create zip archive (plugin package layout)
        run: |
          TAG="${{ steps.get_tag.outputs.TAG_NAME }}"
          ZIP_NAME="strmvod_${TAG}.zip"
          PKG_DIR="strmvod"

          # Match original artifact: single top-level folder "strmvod/" with only plugin files
          mkdir -p "$PKG_DIR"
          cp plugin.py README.txt __init__.py "$PKG_DIR/"
          zip -r "$ZIP_NAME" "$PKG_DIR"
          rm -rf "$PKG_DIR"

      - name: Create GitHub Release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.TAG_NAME }}
          name: ${{ steps.get_tag.outputs.TAG_NAME }}     # release name = tag
          files: strmvod_${{ steps.get_tag.outputs.TAG_NAME }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}